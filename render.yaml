# Render Blueprint for One-Click Deploy
# Alternative to Railway - also very easy!

services:
  # Backend API
  - type: web
    name: beetrack-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beetrack-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: beetrack-redis
          property: connectionString
      - key: PORT
        value: 3000
    healthCheckPath: /health

  # Frontend
  - type: web
    name: beetrack-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: beetrack-backend
          property: host

databases:
  - name: beetrack-db
    plan: starter
    databaseName: beetrack
    user: beetrack

  - name: beetrack-redis
    plan: starter
